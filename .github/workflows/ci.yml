name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 🧹 Lint - verificação de estilo
  lint:
    name: Lint code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 🧪 Testes + cobertura
  test:
    name: Run tests and check coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

  # 🐳 Construção da imagem Docker
  build_image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t meu-usuario/meu-repositorio:latest .

  # 🚀 Publicação da imagem Docker no DockerHub
  publish_image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to DockerHub
        run: |
          docker push meu-usuario/meu-repositorio:latest

  # 🏷️ Atualizar README.md com Badge
  update_readme_badge:
    name: Update README.md with Docker Badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README.md with DockerHub badge
        run: |
          echo '![Docker Image CI](https://img.shields.io/docker/v/meu-usuario/meu-repositorio?label=Version&sort=semver)' >> README.md
          git config --global user.email "seu-email@example.com"
          git config --global user.name "Seu Nome"
          git commit -am "Add Docker badge to README.md"
          git push
